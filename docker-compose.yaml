version: '3'

services:
  product_db:
    image: mysql:latest
    container_name: product_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_detail
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: product_item_broker
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_app
    depends_on:
      product_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=product_detail
      - MYSQL_HOST=product_db
    ports:
      - 8000:8000

volumes:
  mysql_data: