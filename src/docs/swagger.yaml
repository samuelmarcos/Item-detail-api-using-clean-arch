host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for managing product details with clean architecture
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Product Detail API
  version: "1.0"
paths:
  /products:
    get:
      consumes:
      - application/json
      description: Get a list of all products with their details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/desafio_mercado_livre_src_internal_entity.ProductDetail'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_infra_web_controller.ErrorResponse'
      summary: Get all products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product with all its details
      parameters:
      - description: Product Details
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/desafio_mercado_livre_src_internal_entity.ProductDetail'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/desafio_mercado_livre_src_internal_entity.ProductDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_infra_web_controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_infra_web_controller.ErrorResponse'
      summary: Create a new product
      tags:
      - products
  /products/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/desafio_mercado_livre_src_internal_entity.ProductDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_infra_web_controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_infra_web_controller.ErrorResponse'
      summary: Get a product by ID
      tags:
      - products
swagger: "2.0"
