        type: integer
      images:
        items:
          type: string
        minItems: 1
        type: array
      model:
        type: string
      name:
        type: string
      original_price:
        type: number
      payment_options:
        description: Lista de opções de pagamento aceitas
        items:
          type: string
        minItems: 1
